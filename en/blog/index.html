<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Xing Qin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../css/blog-main.css">
</head>
<body>
    <div id="Home"></div>

    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/en/"><img class="dcbo-nav-logo" src="../../my avatar.png" alt="Xing Qin"></a>
            </div>
            <div class="dcbo-nav-actions">
                <details class="dcbo-language-menu">
                    <summary class="dcbo-language-button" aria-label="Select language">
                        <svg class="dcbo-language-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M3 12h18"></path>
                            <path d="M12 3c2.5 2.5 4 5.5 4 9s-1.5 6.5-4 9"></path>
                            <path d="M12 3c-2.5 2.5-4 5.5-4 9s1.5 6.5 4 9"></path>
                        </svg>
                    </summary>
                    <div class="dcbo-language-dropdown">
                        <div class="dcbo-language-title">Select language</div>
                        <a class="dcbo-language-option" href="/blog/"><span>Deutsch</span></a>
                        <a class="dcbo-language-option dcbo-language-active" href="/en/blog/"><span>English</span><span class="dcbo-language-check">✓</span></a>
                    </div>
                </details>
                <ul class="nav-menu"><li><a href="#Kontakt">Contact</a></li></ul>
            </div>
        </div>
    </nav>

    <main class="blog-listing-section">
        <div class="blog-listing-container">
            <div class="blog-listing-header">
                <h1>My Blog</h1>
                <p>Thoughts on marketing, culture, people and the future.</p>
            </div>

            <div class="blog-filters-section">
                <div class="blog-search-box">
                    <input type="text" id="blogSearch" placeholder="Search the blog..." aria-label="Search the blog">
                </div>
                <span class="blog-filter-label">Filter:</span>
                <div class="blog-filters-group">
                    <button class="blog-filter-button active" data-filter="all">All</button>
                    <button class="blog-filter-button" data-filter="marketing">Marketing</button>
                    <button class="blog-filter-button" data-filter="culture">Culture</button>
                    <button class="blog-filter-button" data-filter="ai">AI</button>
                </div>
            </div>

            <div class="blog-grid" id="blogGrid"></div>

            <div class="blog-empty-state" id="emptyState">
                <h3>There is currently no Blog in English.</h3>
                <p>Please check back later for new articles.</p>
            </div>
        </div>
    </main>

    <footer class="dcbo-footer">
        <div class="dcbo-footer-container">
            <div class="dcbo-footer-top">
                <nav class="dcbo-footer-nav" aria-label="Footer Navigation">
                    <a href="/en/">Home</a>
                    <span class="dcbo-footer-nav-divider">|</span>
                    <a href="/en/blog/">Blog</a>
                </nav>
                <div id="Kontakt" class="dcbo-footer-social">
                    <a class="dcbo-footer-icon" href="mailto:x.privat@d0m1.de" aria-label="Email">✉</a>
                    <a class="dcbo-footer-icon dcbo-footer-icon-text" href="https://www.linkedin.com/in/xing-qin/" aria-label="LinkedIn">in</a>
                    <a class="dcbo-footer-icon" href="https://www.instagram.com/xing311" aria-label="Instagram">◎</a>
                    <a class="dcbo-footer-icon dcbo-footer-icon-xing" href="https://www.xing.com/profile/Xing_Qin7/" aria-label="XING">X</a>
                </div>
            </div>
            <div class="dcbo-footer-bottom"><p>&copy; 2026 Xing Qin. All rights reserved.</p></div>
        </div>
    </footer>

    <script>
        const blogSearch = document.getElementById('blogSearch');
        const filterButtons = document.querySelectorAll('.blog-filter-button');
        const emptyState = document.getElementById('emptyState');

        // English articles can be added to blogGrid later using the same blog-card markup as blog/index.html.
        let currentFilter = 'all';
        filterButtons.forEach(button => button.addEventListener('click', () => {
            filterButtons.forEach(item => item.classList.remove('active'));
            button.classList.add('active');
            currentFilter = button.dataset.filter;
        }));
        blogSearch.addEventListener('input', () => {});
    </script>
</body>
</html>
